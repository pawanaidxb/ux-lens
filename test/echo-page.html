<!doctype html><html lang="en"><head><title>Echo booking</title>
<style>
:root{--bg:#FFFFFF;--fg:#0A0A0A;--muted:#737373;--brand:#D71921;--border:#E5E5E5;--s8:8px;--s16:16px;--s24:24px}
body{margin:0;font-family:Urbanist, sans-serif;color:var(--fg);background:var(--bg)}
main{padding:24px 20px}
h1{font-size:36px;line-height:44px;font-weight:600;margin:0 0 16px}
p{font-size:14px;line-height:18px;margin:0 0 12px}
.card{border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 3px 0 #0A0A0A1A;margin-bottom:24px}
.row{display:flex;gap:12px}
.btn{height:36px;padding:0 16px;border-radius:4px;background:var(--brand);color:#FAFAFA;border:0;font:500 14px Urbanist}
input{height:36px;border-radius:8px;border:1px solid var(--border);padding:0 12px;font:400 14px Urbanist}
/* violations */
.promo{background:#E2242C;color:#fff;padding:13px 18px;border-radius:7px;font-family:Arial;font-size:15px}
.legacy{color:#336699;font-size:13px;padding:10px 14px;margin-top:22px}
.btn-old{height:40px;border-radius:20px;background:#555;color:#fff;border:0;padding:0 22px;font:600 14px Urbanist;box-shadow:0 3px 9px rgba(0,0,0,.3)}
</style></head><body><main>
<h1>Choose your flight</h1>
<p>Prices include taxes.</p>
<div class="card"><p>Dubai to London</p><div class="row"><input placeholder="Passenger name" aria-label="Passenger name"><button class="btn">Continue</button></div></div>
<div class="promo">Save 20% this week</div>
<p class="legacy">Legacy note in old blue</p>
<button class="btn-old">Old style button</button>
</main></body></html>
