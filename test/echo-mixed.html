<!doctype html><html lang="en"><head><title>Echo mixed components</title>
<style>
:root{--color-background-neutrals-primary:#FFFFFF;--color-foreground-neutrals-primary:#0A0A0A;--color-background-theme-primary:#D71921;--color-foreground-theme-foreground:#FAFAFA;--color-border-neutrals-primary:#E5E5E5;--color-border-neutrals-input:#E5E5E5;--border-radius-button:4px;--border-radius-input:8px;--spacing-16:16px}
body{margin:0;font-family:Urbanist,sans-serif;color:var(--color-foreground-neutrals-primary);background:var(--color-background-neutrals-primary)}
header{height:72px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--color-border-neutrals-primary)}
main{padding:24px 20px}
h1{font-size:36px;line-height:44px;font-weight:600;margin:0 0 16px}
p{font-size:14px;line-height:18px}
/* library components */
.echo-button{height:36px;padding:0 16px;border-radius:var(--border-radius-button);background:var(--color-background-theme-primary);color:var(--color-foreground-theme-foreground);border:0;font:500 14px Urbanist}
.echo-input{height:36px;border-radius:var(--border-radius-input);border:1px solid var(--color-border-neutrals-input);padding:0 12px;font:400 14px Urbanist;background:#FFFFFF;color:#0A0A0A}
.echo-card{border:1px solid var(--color-border-neutrals-primary);border-radius:12px;padding:16px;margin-bottom:24px;background:#FFFFFF}
/* token-built (no marker) */
.btn-secondary{height:36px;padding:0 16px;border-radius:var(--border-radius-button);background:#F5F5F5;color:#0A0A0A;border:0;font:500 14px Urbanist}
/* custom look-alikes */
.my-btn{height:42px;padding:0 22px;border-radius:21px;background:#E2242C;color:#fff;border:0;font:600 15px Arial;cursor:pointer}
.fake-link-btn{display:inline-block;background:#336699;color:#fff;padding:9px 14px;border-radius:5px;cursor:pointer}
.promo-card{border-radius:10px;background:#FFF3E0;padding:18px;margin:16px 0}
.my-tabs{display:flex;gap:4px}
.my-tabs button{height:30px;border-radius:0;border:0;border-bottom:2px solid #0088CE;background:none;font:500 13px Arial}
</style></head><body>
<header data-echo-component="nav-bar"><b>Echo Air</b></header>
<main>
<h1>Book your trip</h1>
<div class="echo-card"><p>From Dubai to London</p>
  <input class="echo-input" aria-label="Passenger name" placeholder="Passenger name">
  <button class="echo-button">Search flights</button>
  <button class="btn-secondary">Reset</button>
</div>
<div class="promo-card card"><p>Summer sale</p><button class="my-btn">Grab the deal</button></div>
<div class="fake-link-btn">Manage booking</div>
<div class="my-tabs" role="tablist"><button role="tab">Flights</button><button role="tab">Hotels</button></div>
<echo-badge style="display:inline-block;height:20px;padding:0 8px;border-radius:999px;background:#F5F5F5;font:500 12px Urbanist;line-height:20px">New</echo-badge>
</main></body></html>
